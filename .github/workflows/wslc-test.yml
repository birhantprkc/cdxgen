name: wslc container scan

on:
  workflow_dispatch:
  push:
    branches:
      - feat/wslc-oci-windows
    paths:
      - '.github/workflows/wslc-test.yml'
      - 'lib/managers/docker.js'
      - 'lib/managers/docker.poku.js'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token
permissions: {}

jobs:
  wslc-oci-scan:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Install dependencies
        shell: bash
        run: pnpm install:frozen
      - name: Ensure WSL with wslc is available
        shell: pwsh
        run: |
          wsl --version
          # wslc (WSL Containers) needs WSL 2.9.3+. Update WSL first, then fall
          # back to the GitHub-released MSI when the update service is
          # unavailable on the runner image.
          wsl --update | Out-Host
          # The update may have just added wslc's directory to the machine
          # PATH, which the current process does not pick up on its own.
          $refreshPath = {
            $env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path','User')
          }
          & $refreshPath
          $wslc = Get-Command wslc -ErrorAction SilentlyContinue
          if (-not $wslc) {
            Write-Output 'wslc not on PATH after wsl --update; installing the WSL MSI release'
            $msi = Join-Path $env:TEMP 'wsl.msi'
            curl.exe -L -o $msi https://github.com/microsoft/WSL/releases/download/3.0.1/wsl.3.0.1.0.x64.msi
            msiexec /i $msi /qn /norestart | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "WSL MSI install failed with $LASTEXITCODE" }
            & $refreshPath
            $wslc = Get-Command wslc -ErrorAction SilentlyContinue
          }
          if (-not $wslc) {
            $candidate = 'C:\Program Files\WSL\wslc.exe'
            if (Test-Path $candidate) { $env:Path += ';' + (Split-Path $candidate) }
          }
          wslc version
          if ($LASTEXITCODE -ne 0) { throw 'wslc version failed' }
          # Later steps run in fresh processes that inherit the runner agent's
          # environment, not this session's PATH; export wslc's directory via
          # GITHUB_PATH so node's spawnSync can resolve it too.
          $wslcDir = Split-Path (Get-Command wslc).Source
          Add-Content $env:GITHUB_PATH $wslcDir
          Write-Output "wslc added to PATH for subsequent steps: $wslcDir"
          if (Get-Command docker -ErrorAction SilentlyContinue) {
            Write-Output 'docker CLI present; forcing wslc via DOCKER_CMD for this test'
          } else {
            Write-Output 'docker CLI absent; cdxgen auto-selects wslc'
          }
      - name: Scan a small image with wslc
        shell: bash
        env:
          CDXGEN_DEBUG_MODE: debug
          # windows-latest images ship a docker CLI bound to a Windows-containers
          # daemon, which cannot pull Linux images; force the wslc path here.
          DOCKER_CMD: wslc
        run: |
          node bin/cdxgen.js -t oci -o bom-alpine.cdx.json alpine:3.20
          node -e "const b=require('./bom-alpine.cdx.json'); if(!b.components||b.components.length<10){throw new Error('expected OS components in the alpine BOM, got '+b.components?.length)}; console.log('alpine BOM components:', b.components.length)"
      - name: Scan a published cdxgen image with wslc
        shell: bash
        env:
          CDXGEN_DEBUG_MODE: debug
          DOCKER_CMD: wslc
        run: |
          node bin/cdxgen.js -t oci -o bom-cdxgen.cdx.json ghcr.io/cdxgen/cdxgen:latest
          node -e "const b=require('./bom-cdxgen.cdx.json'); if(!b.components||b.components.length<50){throw new Error('expected components in the cdxgen image BOM, got '+b.components?.length)}; const mc=b.metadata&&b.metadata.component; if(!mc||mc.type!=='container'){throw new Error('expected a container parent component')}; console.log('cdxgen image BOM components:', b.components.length, 'parent:', mc.name)"
      - name: Upload BOMs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wslc-boms
          path: |
            bom-alpine.cdx.json
            bom-cdxgen.cdx.json
